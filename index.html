<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Этикетки 43 × 25 мм</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; color:#222; }
    .app { max-width:650px; margin:40px auto; padding:30px; background:#fff; border-radius:18px; box-shadow:0 5px 25px rgba(0,0,0,.08); }
    h1 { text-align:center; margin-top:0; }
    .hint { text-align:center; color:#666; line-height:1.5; margin-bottom:25px; }
    button { width:100%; padding:17px; border:0; border-radius:12px; font-size:18px; cursor:pointer; }
    .mic { background:#222; color:#fff; margin-bottom:15px; font-size:20px; }
    .mic.listening { background:#b42318; }
    textarea { width:100%; min-height:100px; resize:vertical; padding:15px; font-size:18px; border:1px solid #ccc; border-radius:10px; }
    .status { text-align:center; min-height:24px; margin-bottom:12px; color:#555; }
    .label-title { margin-top:30px; font-weight:bold; }
    .preview-wrap { padding:25px 0; overflow-x:auto; }
    .label { width:430px; height:250px; border:1px solid #bbb; background:#fff; margin:auto; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; }
    .stones { font-size:31px; line-height:1.15; font-weight:600; }
    .number { font-size:30px; margin-top:18px; font-weight:bold; }
    .pdf { background:#e7e7e7; color:#111; }
    @media(max-width:520px) {
      .app { margin:0; border-radius:0; padding:20px; min-height:100vh; }
      .label { width:344px; height:200px; }
      .stones { font-size:25px; }
      .number { font-size:24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Этикетки</h1>
  <div class="hint">Нажмите на микрофон и произнесите, например:<br><b>«Тигровый глаз, яшма, номер 12»</b></div>
  <button class="mic" id="micButton">🎤 Говорить</button>
  <div class="status" id="status"></div>
  <textarea id="textInput" placeholder="Здесь появится распознанный текст. Его можно исправить вручную."></textarea>
  <div class="label-title">Предварительный просмотр:</div>
  <div class="preview-wrap">
    <div class="label">
      <div class="stones" id="stonesPreview">Название камня</div>
      <div class="number" id="numberPreview">№ 12</div>
    </div>
  </div>
  <button class="pdf" id="pdfButton">Скачать PDF 43 × 25 мм</button>
</div>
<script>
const input=document.getElementById("textInput");
const stonesPreview=document.getElementById("stonesPreview");
const numberPreview=document.getElementById("numberPreview");
const micButton=document.getElementById("micButton");
const status=document.getElementById("status");

function parseText(text){
  let clean=text.trim();
  const numberMatch=clean.match(/(?:номер|№)\s*(\d+)/i);
  let number="";
  if(numberMatch){ number=numberMatch[1]; clean=clean.replace(/(?:номер|№)\s*\d+/i,""); }
  clean=clean.replace(/[,.]+$/g,"").trim();
  const stones=clean.split(",").map(x=>x.trim()).filter(Boolean);
  return {stones,number};
}
function escapeHTML(text){ const div=document.createElement("div"); div.textContent=text; return div.innerHTML; }
function updatePreview(){
  const data=parseText(input.value);
  stonesPreview.innerHTML=data.stones.length?data.stones.map(escapeHTML).join("<br>"):"Название камня";
  numberPreview.textContent=data.number?"№ "+data.number:"";
}
input.addEventListener("input",updatePreview);

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  const recognition=new SpeechRecognition();
  recognition.lang="ru-RU";
  recognition.interimResults=false;
  recognition.continuous=false;
  micButton.addEventListener("click",()=>{
    status.textContent="Слушаю…";
    micButton.textContent="🎙️ Говорите…";
    micButton.classList.add("listening");
    recognition.start();
  });
  recognition.onresult=e=>{
    input.value=e.results[0][0].transcript;
    updatePreview();
    status.textContent="Готово";
  };
  recognition.onerror=()=>{status.textContent="Не удалось распознать речь. Можно ввести текст вручную.";};
  recognition.onend=()=>{micButton.textContent="🎤 Говорить";micButton.classList.remove("listening");};
}else{
  micButton.disabled=true;
  micButton.textContent="Микрофон не поддерживается этим браузером";
  status.textContent="Введите текст вручную или откройте страницу в Chrome.";
}

document.getElementById("pdfButton").addEventListener("click",createPDF);
function createPDF(){
  const data=parseText(input.value);
  if(!data.stones.length){ alert("Сначала произнесите или введите название."); return; }
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[25,43]});
  pdf.setTextColor(0,0,0);
  let fontSize=12;
  const longest=Math.max(...data.stones.map(s=>s.length));
  if(longest>18) fontSize=9;
  if(longest>25) fontSize=7;
  pdf.setFont("helvetica","bold");
  pdf.setFontSize(fontSize);
  const centerX=21.5, lineHeight=5, totalLines=data.stones.length;
  let startY=data.number?9:12.5-((totalLines-1)*lineHeight/2);
  data.stones.forEach((stone,i)=>pdf.text(stone,centerX,startY+i*lineHeight,{align:"center"}));
  if(data.number){
    pdf.setFontSize(10);
    pdf.text("№ "+data.number,centerX,21,{align:"center"});
  }
  pdf.save(data.number?"etiketka-"+data.number+".pdf":"etiketka.pdf");
}
updatePreview();
</script>
</body>
</html>
