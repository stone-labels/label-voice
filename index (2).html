<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Этикетки 43 × 25 мм</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.app{max-width:650px;margin:40px auto;padding:30px;background:#fff;border-radius:18px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 24px;font-size:28px}
.mic{display:block;width:100%;padding:20px;border:0;border-radius:14px;background:#222;color:#fff;font-size:34px;cursor:pointer;margin-bottom:12px}
.mic.listening{background:#b42318;font-size:20px}
.status{text-align:center;min-height:24px;margin-bottom:12px;color:#555}
textarea{width:100%;min-height:95px;resize:vertical;padding:15px;font-size:18px;border:1px solid #ccc;border-radius:10px}
.label-title{margin-top:28px;font-weight:bold}
.preview-wrap{padding:22px 0;overflow-x:auto}
.label{width:430px;height:250px;border:1px solid #bbb;background:#fff;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.stones{font-size:31px;line-height:1.18;font-weight:600}
.number{font-size:30px;margin-top:18px;font-weight:bold}
.pdf{width:100%;padding:17px;border:0;border-radius:12px;font-size:18px;cursor:pointer;background:#e7e7e7;color:#111}
@media(max-width:520px){
 .app{margin:0;border-radius:0;padding:20px;min-height:100vh}
 .label{width:344px;height:200px}
 .stones{font-size:25px}
 .number{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
<h1>Этикетки 43 × 25 мм</h1>
<button class="mic" id="micButton" aria-label="Микрофон">🎤</button>
<div class="status" id="status"></div>
<textarea id="textInput" placeholder="Распознанный текст можно исправить вручную"></textarea>
<div class="label-title">Предварительный просмотр:</div>
<div class="preview-wrap"><div class="label">
<div class="stones" id="stonesPreview">Название камня</div>
<div class="number" id="numberPreview"></div>
</div></div>
<button class="pdf" id="pdfButton">Скачать PDF</button>
</div>

<script>
const FONT_B64 = "";
const input=document.getElementById("textInput");
const stonesPreview=document.getElementById("stonesPreview");
const numberPreview=document.getElementById("numberPreview");
const micButton=document.getElementById("micButton");
const status=document.getElementById("status");

function normalizeSpeech(text){
 return text
   .replace(/\bзапятая\b/gi,",")
   .replace(/\bточка с запятой\b/gi,",")
   .replace(/\bномер\s+(\d+)/gi,"номер $1")
   .replace(/\s*,\s*/g,", ")
   .replace(/,+/g,",")
   .trim();
}

function parseText(text){
 let clean=normalizeSpeech(text);
 const numberMatch=clean.match(/(?:номер|№)\s*(\d+)/i);
 let number="";
 if(numberMatch){
   number=numberMatch[1];
   clean=clean.replace(/(?:номер|№)\s*\d+/i,"");
 }
 clean=clean.replace(/[,.\s]+$/g,"").trim();
 const stones=clean.split(",").map(x=>x.trim()).filter(Boolean);
 return {stones,number};
}

function esc(text){
 const d=document.createElement("div"); d.textContent=text; return d.innerHTML;
}

function updatePreview(){
 const normalized=normalizeSpeech(input.value);
 if(normalized!==input.value && /\bзапятая\b/i.test(input.value)) input.value=normalized;
 const d=parseText(input.value);
 stonesPreview.innerHTML=d.stones.length?d.stones.map(esc).join("<br>"):"Название камня";
 numberPreview.textContent=d.number?"№ "+d.number:"";
}
input.addEventListener("input",updatePreview);

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 const recognition=new SpeechRecognition();
 recognition.lang="ru-RU";
 recognition.interimResults=false;
 recognition.continuous=false;
 micButton.addEventListener("click",()=>{
   try{
     status.textContent="Слушаю…";
     micButton.textContent="🔴 Слушаю…";
     micButton.classList.add("listening");
     recognition.start();
   }catch(e){}
 });
 recognition.onresult=e=>{
   input.value=normalizeSpeech(e.results[0][0].transcript);
   updatePreview();
   status.textContent="Готово";
 };
 recognition.onerror=()=>{status.textContent="Не удалось распознать речь. Введите текст вручную.";}
 recognition.onend=()=>{micButton.textContent="🎤";micButton.classList.remove("listening");}
} else {
 micButton.disabled=true;
 status.textContent="Голосовой ввод не поддерживается этим браузером.";
}

document.getElementById("pdfButton").addEventListener("click",createPDF);

function createPDF(){
 const d=parseText(input.value);
 if(!d.stones.length){alert("Сначала произнесите или введите название.");return;}
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[43,25]});

 if(FONT_B64){
   pdf.addFileToVFS("Roboto.ttf",FONT_B64);
   pdf.addFont("Roboto.ttf","Roboto","normal");
   pdf.setFont("Roboto","normal");
 } else {
   alert("Не удалось загрузить русский шрифт. Обновите страницу и попробуйте снова.");
   return;
 }

 const centerX=21.5;
 const maxWidth=39;
 let fontSize=11;
 const longest=d.stones.reduce((a,b)=>a.length>b.length?a:b,"");
 pdf.setFontSize(fontSize);
 while(fontSize>6 && pdf.getTextWidth(longest)>maxWidth){
   fontSize-=0.5;
   pdf.setFontSize(fontSize);
 }
 const lineHeight=Math.max(3.8,fontSize*0.42);
 const numberSpace=d.number?5:0;
 const blockHeight=(d.stones.length-1)*lineHeight+numberSpace;
 let startY=12.5-blockHeight/2;
 pdf.setTextColor(0,0,0);
 d.stones.forEach((stone,i)=>{
   pdf.text(stone,centerX,startY+i*lineHeight,{align:"center"});
 });
 if(d.number){
   pdf.setFontSize(Math.min(10,fontSize));
   pdf.text("№ "+d.number,centerX,startY+d.stones.length*lineHeight+1,{align:"center"});
 }
 pdf.save(d.number?"etiketka-"+d.number+".pdf":"etiketka.pdf");
}
updatePreview();
</script>
</body>
</html>
